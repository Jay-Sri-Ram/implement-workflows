name: CI
on: [push, pull_request]
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - run: cmake -S . -B build
         - run: cmake --build build
         - uses: actions/upload-artifact@v4
           with:
             name: build-output
             path: build/cpu_monitor_app
     test:
       needs: build
       runs-on: ubuntu-latest
       steps:
         - uses: actions/download-artifact@v4
           with:
             name: build-output
             path: build
         - run: ctest --test-dir build --output-on-failure

     deploy:
       needs: test
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/download-artifact@v4
           with:
             name: build-output
             path: build
         - run: ./deploy.sh